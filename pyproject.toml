[project]
name = "mha"
version = "0.1.0"
description = "Multi-harness coding agent with a knowledge-graph context engine for small open models"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.21",
    "graphifyy",
    "networkx>=3.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.30"]

[project.scripts]
mha = "mha.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mha = ["harness/instructions.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
