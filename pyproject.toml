[project]
name = "bird"
version = "0.2.0"
description = "Multi-harness coding agent with a knowledge-graph context engine for small open models"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.21",
    "graphifyy",
    "networkx>=3.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.30"]

[project.scripts]
bird = "bird.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Everything the tool needs at runtime that isn't a .py file. The old entry
# pointed at "harness/instructions.md", a path that stopped existing when
# harness/ became engine/ and the instructions moved into harnesses/<name>/ —
# so wheels shipped no system prompts and no arch page at all. Editable
# installs hid it, because they import straight from the source tree.
# models.json lived at the repo root and hit the same failure — it moved into
# the package so there is one copy, shipped and importable, not two that drift.
bird = ["skills/builtin/*.md", "models.json"]
"bird.harnesses.code" = ["instructions.md"]
"bird.harnesses.lead" = ["instructions.md"]
# static/ is the built Workbench (source in arch-ui/, `npm run build`); the
# asset filenames are content-hashed, hence the glob.
"bird.harnesses.arch" = ["instructions.md", "static/index.html", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
